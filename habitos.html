<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#14161c">
<title>Mis Hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14161c;
    --surface:#1b1e27;
    --surface-2:#242833;
    --border:#333846;
    --text:#EDEAE3;
    --text-dim:#9299AC;
    --text-faint:#5b6072;
    --accent:#E8A33D;
    --radius:18px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100dvh;
    padding-bottom:100px;
    overflow-x:hidden;
  }
  ::selection{background:rgba(232,163,61,.35);}

  .container{max-width:640px;margin:0 auto;padding:0 16px;}

  header{
    padding:28px 16px 18px;
    max-width:640px;margin:0 auto;
    border-bottom:1px solid var(--border);
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-faint);margin-bottom:6px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:32px;
    margin:0 0 4px;
    letter-spacing:-.01em;
  }
  .sub{
    color:var(--text-dim);
    font-size:14px;
  }
  .sub button{
    background:none;border:none;color:var(--text-faint);
    font-size:12px;font-family:'Inter',sans-serif;
    text-decoration:underline;cursor:pointer;padding:0;margin-left:10px;
  }

  #habit-list{max-width:640px;margin:0 auto;padding:18px 16px 0;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-dim);
  }
  .empty-state .glyph{font-size:38px;display:block;margin-bottom:14px;}
  .empty-state p{font-size:14px;line-height:1.6;max-width:280px;margin:6px auto;}

  .habit-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 16px 14px;
    margin-bottom:14px;
    animation:rise .35s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .card-title .emoji{font-size:19px;}
  .card-title .name{font-family:'Fraunces',serif;font-size:19px;font-weight:500;}
  .card-goal{color:var(--text-dim);font-size:12.5px;margin-top:3px;}

  .card-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .percent{
    font-family:'JetBrains Mono',monospace;
    font-size:15px;font-weight:600;
    min-width:42px;text-align:right;
  }
  .edit-btn{
    background:none;border:none;color:var(--text-faint);
    font-size:15px;cursor:pointer;padding:4px 6px;line-height:1;
  }
  .edit-btn:active{color:var(--text);}

  .heatmap-scroll{
    overflow-x:auto;
    margin-top:14px;
    padding-bottom:4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .heatmap-scroll::-webkit-scrollbar{display:none;}
  .heatmap-inner{display:inline-flex;flex-direction:column;gap:3px;}
  .month-row{display:grid;grid-auto-flow:column;grid-auto-columns:13px;gap:3px;height:12px;margin-bottom:2px;}
  .month-label{
    font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-faint);
    white-space:nowrap;
  }
  .weeks-grid{
    display:grid;grid-auto-flow:column;
    grid-template-rows:repeat(7,10px);
    grid-auto-columns:13px;gap:3px;
  }
  .cell{
    width:10px;height:10px;border-radius:3px;
    background:var(--surface-2);
    border:1px solid var(--border);
    cursor:pointer;
    transition:transform .1s ease;
  }
  .cell.future{opacity:.25;pointer-events:none;border:none;background:transparent;}
  .cell.today{box-shadow:0 0 0 1.5px var(--text);}
  .cell:active{transform:scale(1.35);}
  .cell.empty{}

  .fab{
    position:fixed;right:20px;bottom:28px;
    width:56px;height:56px;border-radius:50%;
    background:var(--accent);color:#20140a;
    border:none;font-size:26px;font-weight:600;
    box-shadow:0 6px 20px rgba(232,163,61,.35);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    z-index:50;
  }
  .fab:active{transform:scale(.94);}

  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(10,11,14,.6);
    backdrop-filter:blur(2px);
    display:none;align-items:flex-end;justify-content:center;
    z-index:100;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--surface);
    border:1px solid var(--border);border-bottom:none;
    border-radius:22px 22px 0 0;
    width:100%;max-width:640px;
    padding:10px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88dvh;overflow-y:auto;
    animation:slideup .25s ease both;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:6px auto 16px;}
  .sheet h2{font-family:'Fraunces',serif;font-weight:500;font-size:22px;margin:0 0 18px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.03em;}
  .field input[type=text], .field input[type=number]{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);font-family:'Inter',sans-serif;font-size:16px;
    padding:11px 12px;border-radius:var(--radius-sm);
  }
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}

  .emoji-picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .emoji-picks button{
    background:var(--surface-2);border:1px solid var(--border);border-radius:8px;
    font-size:17px;width:36px;height:36px;cursor:pointer;
  }

  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{
    flex:1;padding:10px;border-radius:var(--radius-sm);
    border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:13.5px;cursor:pointer;
  }
  .type-toggle button.active{
    background:rgba(232,163,61,.14);border-color:var(--accent);color:var(--text);
  }

  .color-picks{display:flex;flex-wrap:wrap;gap:9px;margin-top:8px;}
  .swatch{
    width:30px;height:30px;border-radius:50%;cursor:pointer;
    border:2px solid transparent;
  }
  .swatch.active{border-color:var(--text);}

  .sheet-actions{display:flex;gap:10px;margin-top:22px;}
  .btn{
    flex:1;padding:13px;border-radius:var(--radius-sm);border:none;
    font-family:'Inter',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#20140a;}
  .btn-ghost{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}
  .btn-danger{background:transparent;color:#d9705f;border:1px solid rgba(217,112,95,.35);}
  .btn:active{transform:scale(.98);}

  .log-date{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);margin-bottom:2px;}
  .stepper{display:flex;align-items:center;gap:14px;margin-top:6px;}
  .stepper button{
    width:44px;height:44px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:20px;cursor:pointer;
  }
  .stepper input{
    flex:1;text-align:center;font-size:22px;font-family:'JetBrains Mono',monospace;
    background:transparent;border:none;color:var(--text);
  }
  .bool-toggle{display:flex;gap:10px;margin-top:6px;}
  .bool-toggle button{flex:1;padding:14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:15px;cursor:pointer;}
  .bool-toggle button.active{background:rgba(232,163,61,.14);border-color:var(--accent);color:var(--text);}

  .toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 18px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:200;
  }
  .toast.show{opacity:1;}

  .loading{padding:60px 20px;text-align:center;color:var(--text-faint);font-family:'JetBrains Mono',monospace;font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="eyebrow-year">2026 · en curso</div>
  <h1>Mis Hábitos</h1>
  <div class="sub" id="header-sub">Cargando…<button id="reset-btn">reiniciar datos</button></div>
</header>

<div id="habit-list"><div class="loading">cargando tus hábitos…</div></div>

<button class="fab" id="add-fab">+</button>

<!-- Sheet: crear/editar hábito -->
<div class="sheet-backdrop" id="habit-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="habit-sheet-title">Nuevo hábito</h2>

    <div class="field">
      <label>Emoji</label>
      <input type="text" id="f-emoji" maxlength="4" placeholder="✨">
      <div class="emoji-picks" id="emoji-picks"></div>
    </div>

    <div class="field">
      <label>Nombre</label>
      <input type="text" id="f-name" placeholder="Beber agua">
    </div>

    <div class="field">
      <label>Tipo de registro</label>
      <div class="type-toggle">
        <button type="button" id="type-bool">Sí / No</button>
        <button type="button" id="type-num">Cantidad</button>
      </div>
    </div>

    <div class="row2" id="numeric-fields" style="display:none;">
      <div class="field">
        <label>Meta diaria</label>
        <input type="number" id="f-target" placeholder="8" min="1">
      </div>
      <div class="field">
        <label>Unidad</label>
        <input type="text" id="f-unit" placeholder="vasos">
      </div>
    </div>

    <div class="field">
      <label>Descripción de la meta</label>
      <input type="text" id="f-goal" placeholder="8 vasos por día">
    </div>

    <div class="field">
      <label>Color</label>
      <div class="color-picks" id="color-picks"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="habit-cancel">Cancelar</button>
      <button class="btn btn-danger" id="habit-delete" style="display:none;">Eliminar</button>
      <button class="btn btn-primary" id="habit-save">Guardar</button>
    </div>
  </div>
</div>

<!-- Sheet: registrar día -->
<div class="sheet-backdrop" id="log-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="log-date" id="log-date-label">23 ago 2026</div>
    <h2 id="log-habit-name">Beber agua</h2>

    <div id="log-bool-area" style="display:none;">
      <div class="bool-toggle">
        <button type="button" id="log-no">No cumplido</button>
        <button type="button" id="log-yes">Cumplido ✓</button>
      </div>
    </div>

    <div id="log-num-area" style="display:none;">
      <div class="stepper">
        <button type="button" id="log-minus">–</button>
        <input type="number" id="log-value" min="0">
        <button type="button" id="log-plus">+</button>
      </div>
      <div class="log-date" id="log-unit-label" style="margin-top:8px;"></div>
    </div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="log-cancel">Cancelar</button>
      <button class="btn btn-primary" id="log-save">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const PALETTE = [
    "#5B9BD9","#E8A33D","#D96C93","#4FBDB0",
    "#9B8CD9","#7FA65C","#E8735A","#C9A876"
  ];
  const EMOJI_SUGGESTIONS = ["💧","☀️","📚","🏃","🤓","🧘","📝","💪","🧠","🍎","😴","🎯","🎨","🎸","🚭","🧹"];

  const STORAGE_KEY = "habit-tracker-data";
  const todayStr = fmt(new Date());
  const YEAR = new Date().getFullYear();
  const yearStart = new Date(YEAR,0,1);
  const yearEnd = new Date(YEAR,11,31);
  const MONTHS_ES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

  let state = { habits: [], logs: {} };
  let editingHabitId = null;
  let currentLogCtx = null; // {habitId, dateStr}
  let currentType = 'boolean';
  let currentColor = PALETTE[0];

  function fmt(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function hexToRgb(hex){
    const v = hex.replace("#","");
    return [parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)];
  }
  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(()=>t.classList.remove("show"), 1800);
  }

  function defaultHabits(){
    return [
      {id:uid(), emoji:"💧", name:"Beber agua", type:"numeric", target:8, unit:"vasos", goal:"8 vasos por día", color:PALETTE[0]},
      {id:uid(), emoji:"☀️", name:"Madrugar", type:"boolean", target:1, unit:"", goal:"Todos los días", color:PALETTE[1]},
      {id:uid(), emoji:"📚", name:"Leer", type:"numeric", target:30, unit:"páginas", goal:"30 páginas por día", color:PALETTE[2]},
      {id:uid(), emoji:"🏃", name:"Caminar", type:"numeric", target:10000, unit:"pasos", goal:"10,000 pasos por día", color:PALETTE[3]},
    ];
  }

  async function loadData(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        state = JSON.parse(res.value);
      } else {
        state = { habits: defaultHabits(), logs: {} };
        await persist();
      }
    }catch(e){
      state = { habits: defaultHabits(), logs: {} };
      try{ await persist(); }catch(e2){ console.error(e2); }
    }
    render();
  }

  async function persist(){
    try{
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
      if(!result) console.error("No se pudo guardar");
    }catch(e){ console.error("Error de almacenamiento", e); toast("No se pudo guardar. Intenta de nuevo."); }
  }

  function dayRatio(habit, dateStr){
    const log = state.logs[habit.id];
    if(!log || log[dateStr]===undefined) return 0;
    const v = log[dateStr];
    if(habit.type==="boolean") return v ? 1 : 0;
    const t = habit.target || 1;
    return Math.max(0, Math.min(1, v / t));
  }

  function computePercent(habit){
    const created = habit.createdAt ? new Date(habit.createdAt) : yearStart;
    const start = created > yearStart ? created : yearStart;
    const today = new Date();
    let sum=0, count=0;
    for(let d=new Date(start); d<=today; d.setDate(d.getDate()+1)){
      count++;
      sum += dayRatio(habit, fmt(d));
    }
    if(count===0) return 0;
    return Math.round((sum/count)*100);
  }

  function buildHeatmap(habit){
    // Monday-start columns
    const startOffset = (yearStart.getDay()+6)%7; // 0=mon
    const totalDays = Math.round((yearEnd - yearStart)/86400000)+1;
    const totalCols = Math.ceil((totalDays+startOffset)/7);

    const monthRow = document.createElement("div");
    monthRow.className = "month-row";
    const grid = document.createElement("div");
    grid.className = "weeks-grid";

    let lastMonthLabeled = -1;
    for(let col=0; col<totalCols; col++){
      let monthLabelHere = "";
      for(let row=0; row<7; row++){
        const dayIndex = col*7 + row - startOffset;
        const cellDiv = document.createElement("div");
        if(dayIndex<0 || dayIndex>=totalDays){
          cellDiv.className = "cell future";
        } else {
          const d = new Date(YEAR,0,1+dayIndex);
          const dstr = fmt(d);
          const isFuture = dstr > todayStr;
          const ratio = dayRatio(habit, dstr);
          cellDiv.className = "cell" + (isFuture? " future":"") + (dstr===todayStr? " today":"");
          if(!isFuture){
            if(ratio>0){
              const [r,g,b] = hexToRgb(habit.color);
              const op = 0.28 + ratio*0.72;
              cellDiv.style.background = `rgba(${r},${g},${b},${op})`;
              cellDiv.style.borderColor = `rgba(${r},${g},${b},${Math.min(1,op+0.15)})`;
            }
            cellDiv.title = dstr;
            cellDiv.addEventListener("click", ()=> openLogSheet(habit.id, dstr));
          }
          if(row===0 && d.getDate()<=7 && d.getMonth()!==lastMonthLabeled){
            monthLabelHere = MONTHS_ES[d.getMonth()];
            lastMonthLabeled = d.getMonth();
          }
        }
        grid.appendChild(cellDiv);
      }
      const mCell = document.createElement("div");
      mCell.className="month-label";
      mCell.textContent = monthLabelHere;
      monthRow.appendChild(mCell);
    }

    const wrap = document.createElement("div");
    wrap.className = "heatmap-inner";
    wrap.appendChild(monthRow);
    wrap.appendChild(grid);
    const scroller = document.createElement("div");
    scroller.className = "heatmap-scroll";
    scroller.appendChild(wrap);
    return scroller;
  }

  function render(){
    const list = document.getElementById("habit-list");
    list.innerHTML = "";
    document.getElementById("eyebrow-year").textContent = YEAR + " · en curso";

    if(state.habits.length===0){
      list.innerHTML = `<div class="empty-state"><span class="glyph">🌱</span>
        <p>Aún no tienes hábitos. Toca el botón + para agregar el primero.</p></div>`;
    } else {
      state.habits.forEach(habit=>{
        const card = document.createElement("div");
        card.className = "habit-card";
        const pct = computePercent(habit);
        card.innerHTML = `
          <div class="card-top">
            <div class="card-title">
              <span class="emoji">${habit.emoji||"✨"}</span>
              <span class="name">${escapeHtml(habit.name)}</span>
            </div>
            <div class="card-right">
              <span class="percent" style="color:${habit.color}">${pct}%</span>
              <button class="edit-btn" data-edit="${habit.id}">✎</button>
            </div>
          </div>
          <div class="card-goal">${escapeHtml(habit.goal||"")}</div>
        `;
        card.appendChild(buildHeatmap(habit));
        list.appendChild(card);
      });
    }

    list.querySelectorAll("[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=> openHabitSheet(btn.getAttribute("data-edit")));
    });

    // scroll each heatmap to the end (today)
    list.querySelectorAll(".heatmap-scroll").forEach(el=>{ el.scrollLeft = el.scrollWidth; });

    const total = state.habits.length;
    const avg = total? Math.round(state.habits.reduce((s,h)=>s+computePercent(h),0)/total) : 0;
    document.getElementById("header-sub").innerHTML =
      (total? `${total} hábito${total>1?"s":""} · ${avg}% promedio` : "Empieza tu primer hábito") +
      `<button id="reset-btn">reiniciar datos</button>`;
    document.getElementById("reset-btn").addEventListener("click", resetData);
  }

  function escapeHtml(s){
    return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  async function resetData(){
    if(!confirm("Esto borrará todos tus hábitos y registros. ¿Continuar?")) return;
    state = { habits: [], logs: {} };
    await persist();
    render();
    toast("Datos reiniciados");
  }

  // ---------- Habit sheet ----------
  function openHabitSheet(habitId){
    editingHabitId = habitId || null;
    const habit = habitId ? state.habits.find(h=>h.id===habitId) : null;

    document.getElementById("habit-sheet-title").textContent = habit ? "Editar hábito" : "Nuevo hábito";
    document.getElementById("f-emoji").value = habit ? habit.emoji : "";
    document.getElementById("f-name").value = habit ? habit.name : "";
    document.getElementById("f-target").value = habit ? habit.target : "";
    document.getElementById("f-unit").value = habit ? habit.unit : "";
    document.getElementById("f-goal").value = habit ? habit.goal : "";
    document.getElementById("habit-delete").style.display = habit ? "block" : "none";

    setType(habit ? habit.type : "boolean");
    setColor(habit ? habit.color : PALETTE[state.habits.length % PALETTE.length]);

    document.getElementById("habit-backdrop").classList.add("open");
  }
  function closeHabitSheet(){
    document.getElementById("habit-backdrop").classList.remove("open");
    editingHabitId = null;
  }

  function setType(type){
    currentType = type;
    document.getElementById("type-bool").classList.toggle("active", type==="boolean");
    document.getElementById("type-num").classList.toggle("active", type==="numeric");
    document.getElementById("numeric-fields").style.display = type==="numeric" ? "flex" : "none";
  }
  function setColor(hex){
    currentColor = hex;
    document.querySelectorAll("#color-picks .swatch").forEach(sw=>{
      sw.classList.toggle("active", sw.dataset.color===hex);
    });
  }

  function initPickers(){
    const emojiWrap = document.getElementById("emoji-picks");
    EMOJI_SUGGESTIONS.forEach(e=>{
      const b = document.createElement("button");
      b.type="button"; b.textContent=e;
      b.addEventListener("click", ()=>{ document.getElementById("f-emoji").value = e; });
      emojiWrap.appendChild(b);
    });
    const colorWrap = document.getElementById("color-picks");
    PALETTE.forEach(c=>{
      const sw = document.createElement("div");
      sw.className="swatch"; sw.style.background=c; sw.dataset.color=c;
      sw.addEventListener("click", ()=> setColor(c));
      colorWrap.appendChild(sw);
    });
  }

  document.getElementById("type-bool").addEventListener("click", ()=>setType("boolean"));
  document.getElementById("type-num").addEventListener("click", ()=>setType("numeric"));
  document.getElementById("add-fab").addEventListener("click", ()=>openHabitSheet(null));
  document.getElementById("habit-cancel").addEventListener("click", closeHabitSheet);
  document.getElementById("habit-backdrop").addEventListener("click", (e)=>{ if(e.target.id==="habit-backdrop") closeHabitSheet(); });

  document.getElementById("habit-save").addEventListener("click", async ()=>{
    const name = document.getElementById("f-name").value.trim();
    if(!name){ toast("Ponle un nombre a tu hábito"); return; }
    const emoji = document.getElementById("f-emoji").value.trim() || "✨";
    const target = currentType==="numeric" ? (parseFloat(document.getElementById("f-target").value)||1) : 1;
    const unit = document.getElementById("f-unit").value.trim();
    const goal = document.getElementById("f-goal").value.trim();

    if(editingHabitId){
      const h = state.habits.find(x=>x.id===editingHabitId);
      Object.assign(h, {name, emoji, type:currentType, target, unit, goal, color:currentColor});
    } else {
      state.habits.push({id:uid(), name, emoji, type:currentType, target, unit, goal, color:currentColor, createdAt: new Date().toISOString()});
    }
    await persist();
    closeHabitSheet();
    render();
    toast("Hábito guardado");
  });

  document.getElementById("habit-delete").addEventListener("click", async ()=>{
    if(!editingHabitId) return;
    if(!confirm("¿Eliminar este hábito y todo su historial?")) return;
    state.habits = state.habits.filter(h=>h.id!==editingHabitId);
    delete state.logs[editingHabitId];
    await persist();
    closeHabitSheet();
    render();
    toast("Hábito eliminado");
  });

  // ---------- Log sheet ----------
  function openLogSheet(habitId, dateStr){
    const habit = state.habits.find(h=>h.id===habitId);
    currentLogCtx = {habitId, dateStr};
    const d = new Date(dateStr+"T00:00:00");
    document.getElementById("log-date-label").textContent = d.toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"});
    document.getElementById("log-habit-name").textContent = `${habit.emoji} ${habit.name}`;

    const existing = (state.logs[habitId]||{})[dateStr];

    if(habit.type==="boolean"){
      document.getElementById("log-bool-area").style.display="block";
      document.getElementById("log-num-area").style.display="none";
      document.getElementById("log-yes").classList.toggle("active", !!existing);
      document.getElementById("log-no").classList.toggle("active", !existing);
    } else {
      document.getElementById("log-bool-area").style.display="none";
      document.getElementById("log-num-area").style.display="block";
      document.getElementById("log-value").value = existing!==undefined ? existing : "";
      document.getElementById("log-unit-label").textContent = `Meta: ${habit.target} ${habit.unit||""}`.trim();
    }
    document.getElementById("log-backdrop").classList.add("open");
  }
  function closeLogSheet(){
    document.getElementById("log-backdrop").classList.remove("open");
    currentLogCtx = null;
  }

  document.getElementById("log-cancel").addEventListener("click", closeLogSheet);
  document.getElementById("log-backdrop").addEventListener("click", (e)=>{ if(e.target.id==="log-backdrop") closeLogSheet(); });

  let pendingBool = null;
  document.getElementById("log-yes").addEventListener("click", ()=>{
    pendingBool = true;
    document.getElementById("log-yes").classList.add("active");
    document.getElementById("log-no").classList.remove("active");
  });
  document.getElementById("log-no").addEventListener("click", ()=>{
    pendingBool = false;
    document.getElementById("log-no").classList.add("active");
    document.getElementById("log-yes").classList.remove("active");
  });
  document.getElementById("log-plus").addEventListener("click", ()=>{
    const inp = document.getElementById("log-value");
    inp.value = (parseFloat(inp.value)||0) + 1;
  });
  document.getElementById("log-minus").addEventListener("click", ()=>{
    const inp = document.getElementById("log-value");
    inp.value = Math.max(0, (parseFloat(inp.value)||0) - 1);
  });

  document.getElementById("log-save").addEventListener("click", async ()=>{
    if(!currentLogCtx) return;
    const {habitId, dateStr} = currentLogCtx;
    const habit = state.habits.find(h=>h.id===habitId);
    if(!state.logs[habitId]) state.logs[habitId] = {};

    if(habit.type==="boolean"){
      const val = pendingBool !== null ? pendingBool : !!(state.logs[habitId][dateStr]);
      state.logs[habitId][dateStr] = val;
    } else {
      const v = parseFloat(document.getElementById("log-value").value);
      if(isNaN(v)){ delete state.logs[habitId][dateStr]; }
      else state.logs[habitId][dateStr] = v;
    }
    pendingBool = null;
    await persist();
    closeLogSheet();
    render();
  });

  initPickers();
  loadData();
})();
</script>
</body>
</html>
